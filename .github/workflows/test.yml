name: Tests

# Runs the full mocked test suite (node --test, ~425+ tests — vm-sandboxed
# Code.gs/app.js + server.js helpers; no live calls, no secrets needed) on:
#   - every pull request (any base), and
#   - every push to the DEPLOYED branch.
#
# This repo has NO `main` branch. The Railway/production branch is
# claude/build-ezone-dashboard-QOg5s (see EZONE-ECOSYSTEM-STATUS.md) — never
# reference `main` here. Deliberately separate from deploy-apps-script.yml
# (the clasp deploy pipeline), which this workflow does not touch or gate.

on:
  pull_request:
  push:
    branches:
      - claude/build-ezone-dashboard-QOg5s

permissions:
  contents: read

# A newer push to the same PR/branch supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Matches the toolchain the repo already standardizes on (the clasp
          # workflow runs its tooling on Node 22; package.json requires >=18).
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        env:
          TZ: UTC
        run: npm test -- --test-concurrency=1

  crm-checkpoint-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: crm_checkpoint_test
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test -d crm_checkpoint_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TZ: UTC
      CRM_REQUIRE_POSTGRES_TESTS: '1'
      CRM_TEST_POSTGRES_URL: postgres://crm_test:synthetic-ci-only@127.0.0.1:5432/crm_checkpoint_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Full serial suite on real PostgreSQL
        run: npm test -- --test-concurrency=1
      - name: Commit synthetic recovery checkpoint
        run: node scripts/crm-checkpoint-restart-fixture.js seed
      - name: Restart only the disposable CI database
        run: |
          docker restart '${{ job.services.postgres.id }}'
          for attempt in $(seq 1 30); do
            if docker exec '${{ job.services.postgres.id }}' pg_isready -U crm_test -d crm_checkpoint_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify checkpoint after database and process restart
        run: node scripts/crm-checkpoint-restart-fixture.js verify
      - name: Seed a synthetic backup with a separately held random recovery key
        env:
          CRM_TEST_RECOVERY_DIR: ${{ runner.temp }}/crm-backup-restore
        run: node scripts/crm-checkpoint-backup-fixture.js seed
      - name: Dump fixture schema and restore into a separate disposable database
        run: |
          set -euo pipefail
          docker exec '${{ job.services.postgres.id }}' pg_dump -U crm_test -d crm_checkpoint_test --schema=crm_recovery_fixture --format=custom --no-owner --no-privileges --file=/tmp/crm-fixture.dump
          docker exec '${{ job.services.postgres.id }}' createdb -U crm_test crm_checkpoint_restore_test
          docker exec '${{ job.services.postgres.id }}' pg_restore -U crm_test -d crm_checkpoint_restore_test --exit-on-error --no-owner --no-privileges /tmp/crm-fixture.dump
      - name: Verify restored ciphertext, recovery key, cursors, fencing and retained work
        env:
          CRM_TEST_POSTGRES_URL: postgres://crm_test:synthetic-ci-only@127.0.0.1:5432/crm_checkpoint_restore_test
          CRM_TEST_RECOVERY_DIR: ${{ runner.temp }}/crm-backup-restore
        run: node scripts/crm-checkpoint-backup-fixture.js verify
      - name: Remove synthetic dump and recovery material
        if: always()
        run: |
          docker exec '${{ job.services.postgres.id }}' rm -f /tmp/crm-fixture.dump || true
          node -e "require('node:fs').rmSync(require('node:path').join(process.env.RUNNER_TEMP, 'crm-backup-restore'), {recursive:true, force:true})"

  crm-queue-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/crm-queue-browser-tools --no-save --package-lock=false playwright@1.56.1
          node /tmp/crm-queue-browser-tools/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          echo "CRM_CHROMIUM=$(find "$HOME/.cache/ms-playwright" -type f -name headless_shell -print -quit)" >> "$GITHUB_ENV"
      - name: Required synthetic CRM browser scenarios
        env:
          TZ: UTC
          CRM_REQUIRE_BROWSER_TESTS: '1'
          CRM_PLAYWRIGHT_MODULE: /tmp/crm-queue-browser-tools/node_modules/playwright
        run: node --test --test-concurrency=1 test/crm/queue-browser.test.js
