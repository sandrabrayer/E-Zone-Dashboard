<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="robots" content="noindex">
  <title>E-ZONE · CRM</title>
  <!-- C2 (CHANGELOG-crm-shell-areas.md): the flag-gated CRM shell. Served only
       by /?view=crm (CRM_ENABLED). Assets are hashed like the other bundles
       (server.js ASSETS) and are NOT in sw.js BUNDLE_PATHS. -->
  <link rel="stylesheet" href="crm/crm.css?v=__BUILD__">
</head>
<body>
  <div id="crm-root" class="crm">
    <aside id="crm-menu" class="crm-menu" aria-label="תפריט">
      <div class="crm-brand">E-ZONE <small>CRM</small></div>
      <nav id="crm-nav" class="crm-nav" aria-label="אזורים"></nav>
      <div class="crm-menu-foot">
        <span>מחובר/ת: <span id="crm-user">__USER__</span></span>
        <a href="/?view=classic">חזרה לדשבורד הרגיל</a>
      </div>
    </aside>
    <main class="crm-main">
      <header class="crm-top">
        <button type="button" id="crm-burger" class="crm-burger" aria-label="תפריט">☰</button>
        <h1 id="crm-title">היום שלי</h1>
        <input id="crm-search" class="crm-search" type="search" placeholder="חיפוש לקוח / פנייה" aria-label="חיפוש">
      </header>
      <section id="crm-main" aria-live="polite"></section>
    </main>
    <div id="crm-scrim" class="scrim"></div>
    <aside id="crm-drawer" class="drawer" aria-hidden="true" aria-label="כרטיס לקוח"></aside>
  </div>
  <script src="payment-report-rules.js?v=__BUILD__"></script>
  <script src="crm/crm.js?v=__BUILD__"></script>
  <!-- PWA (CHANGELOG-crm-pwa.md): the same worker as the classic page, registered after load; non-fatal. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) { console.warn('[pwa] service worker registration failed:', err); });
      });
    }
  </script>
</body>
</html>
