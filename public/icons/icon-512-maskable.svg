<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2956"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the OS can safely crop. Logo stays inside
       the 80% safe zone per the maskable-icons spec. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle"
        font-family="Segoe UI, Arial, sans-serif" font-weight="800"
        font-size="160" letter-spacing="8" fill="url(#text)">E-Z</text>
</svg>
